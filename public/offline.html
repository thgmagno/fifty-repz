<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Você está offline | Fifty Repz</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          -apple-system,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background: #ffffff;
        color: #171717;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        max-width: 360px;
      }
      h1 {
        font-size: 1.25rem;
        margin-bottom: 8px;
      }
      p {
        color: #737373;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      button {
        margin-top: 20px;
        border: none;
        border-radius: 8px;
        background: #171717;
        color: #ffffff;
        font-size: 0.9rem;
        font-weight: 500;
        padding: 10px 20px;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0a0a0a;
          color: #fafafa;
        }
        button {
          background: #fafafa;
          color: #171717;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Você está offline</h1>
      <p>
        Sem conexão no momento. Assim que a internet voltar, o Fifty Repz
        volta ao normal.
      </p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
